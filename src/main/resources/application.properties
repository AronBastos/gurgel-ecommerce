# ====================================
# APLICACAO
# ====================================
spring.application.name=gurgel-ecommerce

# ====================================
# BANCO DE DADOS (PostgreSQL)
# Configurável por variáveis de ambiente; os defaults servem ao ambiente
# local (docker compose up -d postgres). Ver .env.example.
# ====================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gurgel_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gurgel}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gurgel}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ====================================
# SERVIDOR
# ====================================
server.port=8080
server.servlet.context-path=/api

# ====================================
# LOG
# ====================================
logging.level.com.gurgel.ecommerce=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.file.name=logs/gurgel-app.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level - %msg%n

# ====================================
# JACKSON
# ====================================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false

# ====================================
# ACTUATOR
# ====================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ====================================
# SWAGGER / OPENAPI (springdoc)
# Caminhos relativos ao context-path /api:
#   Swagger UI:  http://localhost:8080/api/swagger-ui.html
#   OpenAPI JSON: http://localhost:8080/api/v3/api-docs
# ====================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
